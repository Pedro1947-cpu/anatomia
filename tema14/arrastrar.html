<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tema 14 · Rótulos</title>
<style>
:root{--bg:#f6f3ee;--bg2:#efe9e0;--fg:#2b2622;--mut:#8a8178;--card:#fffdf9;--bd:#e6ded2;--ac:#c2697a;--ac2:#f3dde1;--ok:#5e9c76;--okb:#e4f1e8;--no:#cf5c4e;--nob:#fae4e0;--sh:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1b1917;--bg2:#24211e;--fg:#f1ebe4;--mut:#a39a90;--card:#2a2623;--bd:#3b3632;--ac:#e08c9b;--ac2:#4a2f35;--ok:#7cc495;--okb:#203329;--no:#ef8476;--nob:#3d2421;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,var(--ac2),transparent 60%),var(--bg);color:var(--fg);font:15px/1.5 ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;min-height:100vh}
main{max-width:1240px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700}
h1{font-family:"Iowan Old Style","Palatino",Georgia,serif;font-weight:600;font-size:clamp(24px,3.4vw,34px);margin:4px 0 0;letter-spacing:-.01em}
.total{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;box-shadow:var(--sh)}
.total b{font-size:20px}.total small{color:var(--mut);display:block;font-size:12px}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center}
.ring::after{content:"";width:32px;height:32px;border-radius:50%;background:var(--card)}
.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
nav{display:flex;flex-direction:column;gap:8px}
@media(max-width:860px){nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.tab{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;box-shadow:var(--sh);transition:.2s;min-width:150px}
.tab:hover{transform:translateY(-1px)}
.tab.on{border-color:var(--ac);background:linear-gradient(135deg,var(--card),var(--ac2))}
.tab .n{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.tab .t{font-weight:600;font-size:14px}
.bar{height:5px;border-radius:9px;background:var(--bg2);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:16px}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 4px 12px}
.ptitle h2{margin:0;font-family:"Iowan Old Style","Palatino",Georgia,serif;font-weight:600;font-size:22px}
.hint{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto;border-radius:14px;background:#fff;border:1px solid var(--bd)}
.stage{position:relative;min-width:860px}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.z{position:absolute;border:1.5px dashed var(--ac);border-radius:7px;background:rgba(255,250,251,.97);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.08;overflow:hidden;color:#2b2622;cursor:pointer;transition:background .2s,border-color .2s,transform .15s;padding:0 4px}
.z:hover{transform:scale(1.03)}
.z i{position:absolute;left:3px;top:1px;font:700 9px/1 system-ui;color:var(--ac);font-style:normal;opacity:.9}
.z.fill{border-style:solid;background:#fff6f8;font-weight:600}
.z.ok{background:#e9f6ed;border:1.5px solid #5e9c76;color:#1f5133}.z.bad{background:#fde9e5;border:1.5px solid #cf5c4e;color:#7c2418;animation:shake .35s}
.z.drop{background:#fbe3e8;transform:scale(1.06)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;min-height:52px;padding:12px;border-radius:14px;background:var(--bg2)}
.bank.empty{justify-content:center;color:var(--mut);font-size:14px;align-items:center}
.chip{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--bd);cursor:grab;font-size:14px;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:.15s;touch-action:none;user-select:none}
.chip:hover{transform:translateY(-2px);border-color:var(--ac)}
.chip.sel{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-2px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{all:unset;cursor:pointer;padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid var(--bd);background:var(--card);transition:.15s}
.btn:hover{transform:translateY(-1px)}.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.g{background:transparent;border-color:transparent;color:var(--mut)}
#msg{margin-left:auto;font-weight:700;padding:6px 12px;border-radius:999px;font-size:14px}
#msg.good{background:var(--okb);color:var(--ok)}#msg.mid{background:var(--ac2);color:var(--ac)}
.confetti{position:fixed;top:-10px;width:8px;height:12px;border-radius:2px;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.3}}
</style></head><body><main>

const $=i=>document.getElementById(i),stage=$('stage');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function load(n){cur=n;const s=SLIDES[n];placed=s.ans.map(()=>null);selChip=null;const m=$('msg');m.textContent='';m.className='';

 s.order=shuffle(s.ans.map((_,i)=>i));layout();render();tabs()}
function layout(){const s=SLIDES[cur],k=stage.clientWidth/s.w;
 stage.querySelectorAll('.z').forEach(z=>{const b=s.boxes[z.dataset.i];z.style.left=b[0]*k+'px';z.style.top=b[1]*k+'px';z.style.width=(b[2]-b[0])*k+'px';z.style.height=(b[3]-b[1])*k+'px';
  const h=(b[3]-b[1])*k;z.style.fontSize=Math.max(9,Math.min(16*k,h*.62))+'px'})}
function render(){const s=SLIDES[cur];
 stage.querySelectorAll('.z').forEach(z=>{const i=+z.dataset.i,p=placed[i];z.querySelector('span').textContent=p===null?'':s.ans[p];z.classList.remove('ok','bad');z.classList.toggle('fill',p!==null)});
 const used=new Set(placed.filter(p=>p!==null));const bank=$('bank');bank.innerHTML='';bank.classList.remove('empty');
 s.order.filter(i=>!used.has(i)).forEach(i=>{const c=document.createElement('div');c.className='chip'+(selChip===i?' sel':'');c.textContent=s.ans[i];c.draggable=true;
  c.ondragstart=e=>e.dataTransfer.setData('text',String(i));c.onclick=()=>{selChip=selChip===i?null:i;render()};bank.appendChild(c)});
 if(!bank.children.length){bank.textContent='✓ Todo colocado: pulsa Comprobar';bank.classList.add('empty')}}
function put(c,zi){placed.forEach((p,i)=>{if(p===c)placed[i]=null});placed[zi]=c;selChip=null;render()}
function clickZone(i){if(selChip!==null){put(selChip,i)}else if(placed[i]!==null){placed[i]=null;render()}}

$('chk').onclick=()=>{const s=SLIDES[cur];let ok=0,empty=0;

$('rst').onclick=()=>load(cur);
