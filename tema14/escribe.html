 const hit=x=>tk.some(t=>lev(t,x)<=tol(x)||st(t)===st(x)||lev(st(t),st(x))<=Math.max(0,Math.floor(st(x).length/8)));const h=w.filter(hit);
 if(w.length&&h.length===w.length)return 2;
 const lg=w.slice().sort((x,y)=>y.length-x.length)[0];if(w.length>1&&hit(lg)&&h.length>=Math.ceil(w.length/2))return 1;return 0}
let deck=[],pos=0,score=0,wrong=[],state='ask';
const sel=$('sel');sel.innerHTML='<option value="all">Todo el tema 14</option>'+SLIDES.map((s,i)=>`<option value="${i}">Diap. ${s.n} · ${s.t}</option>`).join('');
const IT={k:'t14items',d:null,get(){if(!this.d){try{this.d=JSON.parse(localStorage.getItem(this.k)||'{}')}catch(e){this.d={}}}return this.d},
 rec(id,r){const d=this.get(),x=d[id]||{s:0,c:0,w:0};x.s++;if(r===2){x.c++}else{x.c=0;x.w++}x.t=Date.now();d[id]=x;try{localStorage.setItem(this.k,JSON.stringify(d))}catch(e){}},
 w(id){const x=this.get()[id];if(!x)return 2;return Math.pow((1+x.w*3)/(1+x.c*x.c),2)}};
let again={};
const PAL=['194,105,122','38,166,154','124,92,214','235,134,40','72,166,92','52,120,224','214,160,24','224,72,120'];let lastPal=-1;
function nextPal(){let i;do{i=Math.floor(Math.random()*PAL.length)}while(i===lastPal);lastPal=i;return PAL[i]}
function start(){const v=sel.value;deck=[];SLIDES.forEach((s,si)=>{if(v==='all'||+v===si)s.ans.forEach((_,bi)=>deck.push([si,bi]))});
 if($('mode').value==='smart'){const k=deck.map(d=>[Math.pow(Math.random(),1/IT.w(SLIDES[d[0]].n+'-'+d[1])),d]);k.sort((a,b)=>b[0]-a[0]);deck=k.map(x=>x[1])}
 else for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
 pos=0;score=0;wrong=[];again={};ask()}
function ask(){state='ask';if(pos>=deck.length)return end();const[si,bi]=deck[pos],s=SLIDES[si];
 $('cnt').textContent=(pos+1)+' / '+deck.length;$('bar').style.width=pos/deck.length*100+'%';
 $('wrap').innerHTML=`<div class="fig" id="fig"><img src="${s.img}" alt=""></div>${(()=>{const x=IT.get()[s.n+"-"+bi];return again[pos]?'<div class="tag">Otra vez · lo fallaste hace un momento</div>':(x&&x.w&&x.c===0?'<div class="tag">Lo fallaste la última vez</div>':"")})()}<div class="q">${(s.q&&s.q[bi])||"¿Qué es la parte marcada?"}</div>
 <div class="frm"><input id="in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí…"><button id="go" type="button">→</button></div><div class="fb" id="fb"></div>`;
 const fig=$('fig');s.boxes.forEach((b,i)=>{const d=document.createElement('div');d.className='b'+(i===bi?' cur':'');if(i===bi)d.style.setProperty('--hl',nextPal());
  Object.assign(d.style,{left:b[0]/s.w*100+'%',top:b[1]/s.h*100+'%',width:(b[2]-b[0])/s.w*100+'%',height:(b[3]-b[1])/s.h*100+'%'});fig.appendChild(d)});
 
 $('go').onclick=step;try{$('in').focus()}catch(e){}}
function step(){if(state==='ask')check();else if(state==='done'){pos++;ask()}}
addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&document.getElementById('in')){e.preventDefault();step()}});
function check(){state='done';const[si,bi]=deck[pos],ans0=SLIDES[si].ans[bi],v=$('in').value,r=judge(v,ans0),ans=shown(ans0);$('in').readOnly=true;$('go').textContent='Siguiente →';
 const sn=SLIDES[si].n;IT.rec(sn+'-'+bi,r);const key=si+'-'+bi;if(r<2&&$('mode').value==='smart'&&(again['n'+key]||0)<2){again['n'+key]=(again['n'+key]||0)+1;const at=Math.min(pos+4,deck.length);deck.splice(at,0,deck[pos]);for(const k in again)if(!isNaN(k)&&+k>=at)again[+k+1]=again[k],delete again[k];again[at]=1}
 ST.add(sn,1,r===2?1:r===1?.5:0);
 if(r===2){score++;$('fb').innerHTML=`<span class="ok">Bien ✓</span><small>${ans}</small>`}
 else if(r===1){score+=.5;$('fb').innerHTML=`<span class="ok">Casi · medio punto</span><small>Completo: ${ans}</small>`;wrong.push(deck[pos])}
 else{const esc=v.replace(/[<>&]/g,'');$('fb').innerHTML=`<span class="no">${v.trim()?'No':'Era'}</span><small>${ans}${v.trim()?' · has escrito: «'+esc+'»':''}</small>`;wrong.push(deck[pos])}
 $('bar').style.width=(pos+1)/deck.length*100+'%'}
function end(){$('cnt').textContent='';$('wrap').innerHTML=`<div class="end"><b>${score} / ${deck.length}</b>${wrong.length?wrong.length+' para repasar':'Pleno ✨'}<br>
 ${wrong.length?'<button id="rw">Repetir solo los fallos</button> ':''}<button id="ag" style="background:transparent;color:var(--fg);border:1px solid var(--line)">Otra vez todo</button></div>`;
 if(wrong.length)$('rw').onclick=()=>{deck=wrong;wrong=[];pos=0;score=0;ask()};$('ag').onclick=start}
function thumb(){const b=document.querySelector('.seg button.on'),t=$('thumb');t.style.left=b.offsetLeft+'px';t.style.width=b.offsetWidth+'px'}
addEventListener('resize',thumb);setTimeout(thumb,0);document.fonts&&document.fonts.ready.then(thumb);
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));thumb();$('mode').value=b.dataset.m;start()});
sel.onchange=start;$('mode').onchange=start;start();
</script></body></html>
