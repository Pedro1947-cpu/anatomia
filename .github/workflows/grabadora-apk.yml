name: Grabadora APK

on:
  push:
    paths:
      - "grabadora/**"
      - ".github/workflows/grabadora-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en un Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: grabadora
          script: gradle --no-daemon connectedDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-pruebas
          path: grabadora/app/build/reports/androidTests/

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grabadora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Grabadora.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Grabadora-apk
          path: grabadora/Grabadora.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "grabadora-v1.${{ github.run_number }}" Grabadora.apk \
            --target "${{ github.sha }}" \
            --title "Grabadora de clases 1.${{ github.run_number }}" \
            --notes "Descarga Grabadora.apk en el móvil e instálala." \
            --latest
